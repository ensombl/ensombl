[package]
name = "crm"
version = "0.1.0"
description = "Clanker Resource Management: an architecture-first editor for coding agents"
authors = ["ensombl"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The program is named after the app, so macOS shows "Ensombl" in dev too.
[[bin]]
name = "Ensombl"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "crm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12.0.1", features = ["serde-compat", "no-serde-warnings"] }
thiserror = "2.0.21"
tauri-plugin-dialog = "2.8.4"
blake3 = "1.8.7"
tree-sitter = "0.27.1"
tree-sitter-typescript = "0.23.2"
rayon = "1.12.0"
ignore = "0.4.34"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
portable-pty = "0.9.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
