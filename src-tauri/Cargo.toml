[package]
name = "crm"
version = "0.1.0"
description = "Ensombl desktop app: the Tauri shell around ensombl-core"
authors = ["ensombl"]
edition = "2024"

# The program is named after the app, so macOS shows "Ensombl" in dev too.
[[bin]]
name = "Ensombl"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "crm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ensombl-core = { path = "../crates/ensombl-core" }
ensombl-server = { path = "../crates/ensombl-server" }
ensombl-mcp = { path = "../crates/ensombl-mcp" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.8.4"
serde_json = "1"
