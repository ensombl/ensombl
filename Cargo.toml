[workspace]
members = ["crates/ensombl-core", "crates/ensombl-mcp", "crates/ensombl-server", "src-tauri"]
resolver = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
