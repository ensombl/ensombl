[package]
name = "ensombl-server"
version = "0.2.1"
description = "Ensombl without a window: the core behind an HTTP + WebSocket API"
authors = ["ensombl"]
edition = "2024"

[dependencies]
ensombl-core = { path = "../ensombl-core" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.27"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
futures-util = "0.3"
