[package]
name = "ensombl-mcp"
version = "0.1.0"
description = "MCP server over stdio that lets an agent hand tasks to Ensombl"
authors = ["ensombl"]
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
ensombl-core = { path = "../ensombl-core" }
ensombl-server = { path = "../ensombl-server" }
tempfile = "3.27.0"
